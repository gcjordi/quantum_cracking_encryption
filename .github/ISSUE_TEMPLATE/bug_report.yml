name: Bug report
description: Report a reproducible problem in the package, notebooks, UI, documentation or CI.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please keep reports focused on the educational project and do not include private keys, credentials or sensitive data.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Python package
        - Notebook
        - Gradio UI
        - Documentation
        - CI / GitHub Actions
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Provide the smallest reproducible sequence of steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system or notebook environment, and relevant package versions.
      placeholder: "Example: Python 3.14, Google Colab, NumPy 2.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste only non-sensitive logs, tracebacks or screenshots.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: This report does not contain secrets, credentials, private keys or sensitive data.
          required: true
