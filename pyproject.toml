[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-cryptography-lab"
version = "2.0.0"
description = "Provider-neutral educational Shor, RSA and post-quantum cryptography lab"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
authors = [{name = "Jordi Garcia Castillón"}]
dependencies = ["numpy>=1.26,<3"]
keywords = ["quantum-computing", "shor", "rsa", "post-quantum-cryptography", "cybersecurity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ui = ["gradio>=5,<7"]

[project.scripts]
quantum-crypto-lab = "quantum_crypto_lab.cli:main"

[tool.setuptools.packages.find]
include = ["quantum_crypto_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
